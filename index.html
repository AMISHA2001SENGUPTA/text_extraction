<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Extraction (Upload an image)</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@2"></script>
</head>
<body>
    <h1>Tesseract.js OCR Example</h1>
    <input type="file" id="image-upload" accept="image/*">
    <button onclick="processImage()">Extract Text</button>
    <p id="status"></p>
    <p id="output"></p>

    <script>
        async function processImage() {
            const imageUpload = document.getElementById('image-upload');
            const status = document.getElementById('status');
            const output = document.getElementById('output');

            if (!imageUpload.files[0]) {
                status.textContent = 'Please upload an image.';
                return;
            }

            const image = URL.createObjectURL(imageUpload.files[0]);

            status.textContent = 'Processing image...';

            try {
                const worker = Tesseract.createWorker({
                    logger: info => console.log(info) // Log progress
                });

                await worker.load(); // Load the Tesseract worker
                await worker.loadLanguage('eng'); // Load English language
                await worker.initialize('eng'); // Initialize the worker with the language

                const { data: { text } } = await worker.recognize(image); // Perform OCR

                status.textContent = 'Processing completed!';
                output.textContent = `Extracted Text: ${text}`;

                await worker.terminate(); // Terminate the worker
            } catch (error) {
                console.error('Error:', error); // Log the error for debugging
                status.textContent = 'Failed to extract text from the image. Please try again with a different image.';
            }
        }
    </script>
</body>
</html>
